name: Deploy to GitHub Pages

# Optional: only needed if you publish with GitHub Pages instead of Netlify.
# The site is deployed on Netlify, so this runs only when started by hand
# (Actions → Deploy to GitHub Pages → Run workflow). To switch to Pages, enable
# Settings → Pages → Source: "GitHub Actions" and add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

# Default: no permissions. Each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions pinned to commit SHAs (resolved from release tags on 2026-10-27). Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # https://<username>.github.io and /<repository-name>.
          # For a custom domain: SITE_URL=https://yourdomain and BASE_PATH=/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - run: npm run test:links
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
